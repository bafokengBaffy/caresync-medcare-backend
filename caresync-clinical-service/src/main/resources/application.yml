server:
  port: ${PORT:8080}
caresync:
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
  firestore:
    enabled: ${FIRESTORE_ENABLED:false}
spring:
  profiles:
    default: local
  application:
    name: caresync-clinical-service
  datasource:
    url: ${DB_URL:${SUPABASE_DB_URL}}
    username: ${DB_USER:${SUPABASE_DB_USER}}
    password: ${DB_PASSWORD:${SUPABASE_DB_PASSWORD}}
    hikari:
      maximum-pool-size: 5
      data-source-properties:
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
