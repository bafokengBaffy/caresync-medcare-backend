server:
  port: ${PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    default: local
  application:
    name: caresync-patient-service
  datasource:
    url: ${DB_URL:${SUPABASE_DB_URL}}
    username: ${DB_USER:${SUPABASE_DB_USER}}
    password: ${DB_PASSWORD:${SUPABASE_DB_PASSWORD}}
    hikari:
      maximum-pool-size: 5
      data-source-properties:
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
caresync:
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
  storage:
    enabled: ${SUPABASE_STORAGE_ENABLED:false}
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:caresync-bucket}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics