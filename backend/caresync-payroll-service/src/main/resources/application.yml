server:
  port: ${PORT:8085}
spring:
  application:
    name: caresync-payroll-service
  datasource:
    url: ${DB_URL:${SUPABASE_DB_URL}}
    username: ${DB_USER:${SUPABASE_DB_USER}}
    password: ${DB_PASSWORD:${SUPABASE_DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      data-source-properties:
        sslmode: ${DB_SSLMODE:require}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:caresync_payroll}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:caresync_payroll}
    default-schema: ${DB_SCHEMA:caresync_payroll}
  cloud:
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
eureka:
  client:
    enabled: ${DISCOVERY_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
caresync:
  payroll:
    timezone: ${PAYROLL_TIMEZONE:UTC}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
