# Shared defaults for every CareSync service that depends on caresync-common.
caresync:
  cors:
    allowed-origins: ${CARESYNC_CORS_ORIGINS:http://localhost:5173}
  redis:
    host: ${CARESYNC_REDIS_HOST:localhost}
    port: ${CARESYNC_REDIS_PORT:6379}
    username: ${CARESYNC_REDIS_USERNAME:}
    password: ${CARESYNC_REDIS_PASSWORD:}