server:
  port: ${PORT:8081}

spring:
  application:
    name: caresync-patient-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/caresync}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${SUPABASE_DB_USER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${SUPABASE_DB_PASSWORD:password}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # OWASP: Never use 'create' or 'update' in production
    show-sql: false # OWASP: Disable SQL logging in production to prevent data leakage
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Firebase Configuration
firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
caresync:
  firebase:
    enabled: ${FIREBASE_ENABLED:true}

# Actuator (Health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Eureka/Discovery (if using)
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
