envVarGroups:
  - name: caresync-firebase
    envVars:
      - key: FIREBASE_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_BOOTSTRAP_ADMIN_EMAIL
        value: baffkay20@gmail.com,maribemaribe43@gmail.com,kokikoki@gmail.com
      - key: FIREBASE_BOOTSTRAP_ADMIN_TENANT_SUBDOMAIN
        value: caresync

  - name: caresync-database
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false

  - name: caresync-storage
    envVars:
      - key: SUPABASE_STORAGE_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: caresync-bucket
      - key: SUPABASE_PROFILE_IMAGE_BUCKET
        value: caresync-bucket

  - name: caresync-cloudamqp
    envVars:
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: SPRING_RABBITMQ_SSL_ENABLED
        value: "true"

services:
  - type: web
    name: caresync-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./caresync-api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - key: SERVICE_NAME
        value: caresync-api-gateway
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_CLOUD_DISCOVERY_ENABLED
        value: "false"
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://caresync-medcare-9e0a5.web.app,https://caresync-medcare-9e0a5.firebaseapp.com
      - key: PATIENT_SERVICE_URL
        fromService:
          type: web
          name: caresync-patient-service
          property: host
      - key: CLINICAL_SERVICE_URL
        fromService:
          type: web
          name: caresync-clinical-service
          property: host
      - key: BILLING_SERVICE_URL
        fromService:
          type: web
          name: caresync-billing-service
          property: host
      - key: LABORATORY_SERVICE_URL
        fromService:
          type: web
          name: caresync-laboratory-service
          property: host

  - type: web
    name: caresync-patient-service
    runtime: docker
    plan: free
    dockerfilePath: ./caresync-patient-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - fromGroup: caresync-storage
      - key: SERVICE_NAME
        value: caresync-patient-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_CLOUD_DISCOVERY_ENABLED
        value: "false"
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: FIREBASE_USER_SYNC_INTERVAL_MS
        value: "60000"
      - key: FIREBASE_USER_SYNC_INITIAL_DELAY_MS
        value: "10000"

  - type: web
    name: caresync-clinical-service
    runtime: docker
    plan: free
    dockerfilePath: ./caresync-clinical-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - fromGroup: caresync-cloudamqp
      - key: SERVICE_NAME
        value: caresync-clinical-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_CLOUD_DISCOVERY_ENABLED
        value: "false"
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: FIRESTORE_ENABLED
        value: "true"
      - key: SPRING_FLYWAY_ENABLED
        value: "false"

  - type: web
    name: caresync-billing-service
    runtime: docker
    plan: free
    dockerfilePath: ./caresync-billing-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - fromGroup: caresync-cloudamqp
      - key: SERVICE_NAME
        value: caresync-billing-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_CLOUD_DISCOVERY_ENABLED
        value: "false"
      - key: EUREKA_CLIENT_ENABLED
        value: "false"

  - type: web
    name: caresync-laboratory-service
    runtime: docker
    plan: free
    dockerfilePath: ./caresync-laboratory-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - key: SERVICE_NAME
        value: caresync-laboratory-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_CLOUD_DISCOVERY_ENABLED
        value: "false"
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: DB_SCHEMA
        value: caresync_laboratory
      - key: DISCOVERY_ENABLED
        value: "false"

  - type: web
    name: caresync-payroll-service
    runtime: docker
    plan: free
    dockerfilePath: ./caresync-payroll-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - key: SERVICE_NAME
        value: caresync-payroll-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_SCHEMA
        value: caresync_payroll
      - key: DISCOVERY_ENABLED
        value: "false"
