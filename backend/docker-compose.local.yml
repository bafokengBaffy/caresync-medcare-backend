services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: caresync
      POSTGRES_USER: ${DB_USER:-caresync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting local dependencies}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caresync} -d caresync"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD before starting local dependencies}
    ports:
      - "5672:5672"
      - "15672:15672"
