envVarGroups:
  - name: caresync-firebase
    envVars:
      - key: FIREBASE_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false

  - name: caresync-database
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false

  - name: caresync-storage
    envVars:
      - key: SUPABASE_STORAGE_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: caresync-bucket
      - key: SUPABASE_PROFILE_IMAGE_BUCKET
        value: caresync-bucket

  - name: caresync-cloudamqp
    envVars:
      - key: SPRING_RABBITMQ_HOST
        value: toucan.lmq.cloudamqp.com
      - key: SPRING_RABBITMQ_PORT
        value: "5671"
      - key: SPRING_RABBITMQ_USERNAME
        value: psczzhvm
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_VIRTUAL_HOST
        value: psczzhvm
      - key: SPRING_RABBITMQ_SSL_ENABLED
        value: "true"

services:
  - type: web
    name: caresync-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/caresync-api-gateway/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - key: SERVICE_NAME
        value: caresync-api-gateway
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ALLOWED_ORIGINS
        value: https://caresync-medcare-9e0a5.web.app,https://caresync-medcare-9e0a5.firebaseapp.com
      - key: PATIENT_SERVICE_URL
        fromService:
          type: web
          name: caresync-patient-service
          property: host
      - key: CLINICAL_SERVICE_URL
        fromService:
          type: web
          name: caresync-clinical-service
          property: host
      - key: BILLING_SERVICE_URL
        fromService:
          type: web
          name: caresync-billing-service
          property: host
      - key: LABORATORY_SERVICE_URL
        fromService:
          type: web
          name: caresync-laboratory-service
          property: host
      - key: PAYROLL_SERVICE_URL
        fromService:
          type: web
          name: caresync-payroll-service
          property: host

  - type: web
    name: caresync-patient-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/caresync-patient-service/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - fromGroup: caresync-storage
      - key: SERVICE_NAME
        value: caresync-patient-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: web
    name: caresync-clinical-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/caresync-clinical-service/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - fromGroup: caresync-cloudamqp
      - key: SERVICE_NAME
        value: caresync-clinical-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FIRESTORE_ENABLED
        value: "true"
      - key: SPRING_FLYWAY_ENABLED
        value: "false"

  - type: web
    name: caresync-billing-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/caresync-billing-service/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - fromGroup: caresync-cloudamqp
      - key: SERVICE_NAME
        value: caresync-billing-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: web
    name: caresync-laboratory-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/caresync-laboratory-service/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - key: SERVICE_NAME
        value: caresync-laboratory-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_SCHEMA
        value: caresync_laboratory
      - key: DISCOVERY_ENABLED
        value: "false"

  - type: web
    name: caresync-payroll-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/caresync-payroll-service/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: caresync-firebase
      - fromGroup: caresync-database
      - key: SERVICE_NAME
        value: caresync-payroll-service
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_SCHEMA
        value: caresync_payroll
      - key: DISCOVERY_ENABLED
        value: "false"
