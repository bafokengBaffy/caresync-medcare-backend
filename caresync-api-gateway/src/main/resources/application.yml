server:
  port: ${PORT:8080}
spring:
  profiles:
    default: local
  application:
    name: caresync-api-gateway
caresync:
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
  gateway:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,https://caresync-medcare-9e0a5.web.app,https://caresync-medcare-9e0a5.firebaseapp.com}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    root: INFO